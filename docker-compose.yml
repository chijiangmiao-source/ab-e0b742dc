# Compose 部署（宿主端口可配置）：
#   HOST_PORT=9090 docker compose up --build
#
# 一次性验收服务（运行后退出，以退出码报告结果）：
#   docker compose --profile verify run --rm verify
services:
  discrete-review:
    build: .
    image: discrete-link-review:latest
    container_name: discrete-link-review
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      # 宿主端口可配置：HOST_PORT 缺省 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  verify:
    # verify 自行启动临时服务器完成 /health 冒烟后退出，不占用宿主端口。
    profiles: ["verify"]
    image: discrete-link-review:latest
    build: .
    command: ["node", "scripts/verify.js"]
    restart: "no"
